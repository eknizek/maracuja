<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Golf</title>
  <style>
    body {
      background: #2a2a2a;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
    }
    h1 { margin: 0 0 12px 0; font-weight: 400; letter-spacing: 1px; }
    canvas {
      border: 2px solid #555;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: block;
    }
    .hint { margin-top: 14px; color: #aaa; font-size: 14px; }
    .clubs { display: flex; gap: 8px; margin-top: 8px; }
    .clubs button {
      background: #444;
      color: white;
      border: 2px solid #666;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .clubs button:hover { background: #555; }
    .clubs button.selected {
      background: #4a8a5a;
      border-color: #7cd49a;
    }
    .dev { margin-top: 10px; }
    .dev button {
      background: #553355;
      color: #ddd;
      border: 1px dashed #888;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .dev button:hover { background: #664466; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>

    ];

    const COURSES = [
      { name: 'The Original',      holes: HOLES_ORIGINAL },
      { name: 'Easy Breezy',       holes: HOLES_EASY     },
      { name: 'Mini Mayhem',       holes: HOLES_MINI     },
      { name: 'Tour Championship', holes: HOLES_CHAMP    },
      { name: 'Pizza Crek',        holes: HOLES_PIZZA    },
    ];

    // --- Tunable feel ---
    const FRICTION = 0.985;
    const ROUGH_FRICTION = 0.955;
    const SAND_FRICTION = 0.94;
    const TREE_FRICTION = 0.90;
    const GREEN_PENALTY_FRICTION = 0.92;
    const STOP_SPEED = 0.1;
    const SINK_SPEED = 3.0;
    const MAX_DRAG = 150;
    const POWER_SCALE = 0.12;
    const BALL_R = 8;
    const WIND_THRESHOLD = 1.2;

    const CLUBS = {
      driver: { name: 'Driver', power: 1.1 },
      iron:   { name: 'Iron',   power: 1.0 },
      wedge:  { name: 'Wedge',  power: 0.55 },
      putter: { name: 'Putter', power: 0.25 },
    };
    let currentClub = 'iron';

    // --- Lobby ---
    const LOBBY_W = 800;
    const LOBBY_H = 595;
    const BALL_COLORS = [
      { name: 'White',  rgb: [255, 255, 255] },
      { name: 'Red',    rgb: [220, 60, 60]   },
      { name: 'Blue',   rgb: [80, 140, 230]  },
      { name: 'Yellow', rgb: [255, 220, 80]  },
      { name: 'Green',  rgb: [120, 220, 130] },
      { name: 'Pink',   rgb: [255, 130, 200] },
      { name: 'Orange', rgb: [255, 150, 60]  },
      { name: 'Purple', rgb: [180, 120, 230] },
    ];
    // --- Players (multiplayer support, 1-4 pass-and-play) ---
    const PLAYER_DEFAULT_COLORS = [
      [255, 255, 255], // P1 white
      [220, 60, 60],   // P2 red
      [80, 140, 230],  // P3 blue
      [255, 220, 80],  // P4 yellow
    ];
    const MAX_PLAYERS = 4;
    const players = makeInitialPlayers();
    let numPlayers = 1;        // how many of `players` are actually playing this round
    let activeLobbyPlayer = 0; // which player the lobby ball-customizer is editing

    // --- Game state ---
    let gameState = 'lobby'; // 'lobby' | 'playing'
    let currentCourseIndex = 0;
    let currentHoleIndex = 0;
    let currentPlayerIndex = 0; // whose turn it is during play
    let ball;
    let lastShotPos;
    let shotClub = null;
    let aiming = false;
    let won = false;

    function makeInitialPlayers() {
      return PLAYER_DEFAULT_COLORS.map((c, i) => ({
        color: c.slice(),
        name: `Player ${i + 1}`,
        holeScores: [],     // strokes per finished hole (null = skipped via dev button)
        strokes: 0,         // strokes on current hole
        totalStrokes: 0,    // running total across finished holes
      }));
    }

    function currentCourse() { return COURSES[currentCourseIndex]; }
    function hole() { return currentCourse().holes[currentHoleIndex]; }
    function currentPlayer() { return players[currentPlayerIndex]; }
    function lobbyPlayer()   { return players[activeLobbyPlayer]; }

    function setup() {
      const c = createCanvas(LOBBY_W, LOBBY_H);
      c.parent('game');
      resetBall();
    }

    function resetBall() {
      const h = hole();
      ball = { x: h.tee.x, y: h.tee.y, vx: 0, vy: 0 };
      lastShotPos = { x: h.tee.x, y: h.tee.y };
    }

    function draw() {
      if (gameState === 'lobby') {
        drawLobby();
        return;
      }
      drawHole();
      updateBall();
      drawBall();
      if (aiming && !won) drawAimArrow();
      drawHud();
      if (won) drawWinScreen();
    }

      const btn = lobbyPlayButton();

    function lobbyPlayButton() {
      return { x: 490, y: 495, w: 280, h: 80 };
    }

    function courseButton(i) {
      return { x: 460 + 15, y: 195 + i * 25, w: 310 - 30, h: 22 };

    function drawLobbyScene() {

      drawBackgroundTrees();

    function drawBackgroundTrees() {

    function drawBackgroundTree(baseX, baseY, size) {
      noStroke();
      // Trunk
      fill(110, 70, 40);
      rect(baseX - size * 0.12, baseY - size * 1.1, size * 0.24, size * 1.1, 3);
      // Canopy — 3 overlapping circles for a fluffy cartoon look
      fill(45, 120, 55);
      circle(baseX - size * 0.5, baseY - size * 1.45, size * 1.3);
      circle(baseX + size * 0.5, baseY - size * 1.45, size * 1.3);
      circle(baseX,              baseY - size * 2.05, size * 1.45);
      // Lighter highlight on the top canopy
      fill(85, 170, 85);
      circle(baseX - size * 0.25, baseY - size * 2.2, size * 0.7);
    }

    function lobbyClick(mx, my) {
      // Course buttons
      for (let i = 0; i < COURSES.length; i++) {
        const cb = courseButton(i);
        if (mx >= cb.x && mx <= cb.x + cb.w && my >= cb.y && my <= cb.y + cb.h) {
          currentCourseIndex = i;
          return;
        }
      }
      // Player count buttons
      for (let i = 0; i < MAX_PLAYERS; i++) {
        const pcb = playerCountButton(i);
        if (mx >= pcb.x && mx <= pcb.x + pcb.w && my >= pcb.y && my <= pcb.y + pcb.h) {
          numPlayers = i + 1;
          if (activeLobbyPlayer >= numPlayers) activeLobbyPlayer = 0;
          return;
        }
      }
      // Customize tabs (which player's ball we're editing)
      if (numPlayers > 1) {
        for (let i = 0; i < numPlayers; i++) {
          const tab = customizeTab(i);
          if (mx >= tab.x && mx <= tab.x + tab.w && my >= tab.y && my <= tab.y + tab.h) {
            activeLobbyPlayer = i;
            return;
          }
        }
      }
      // Swatches set the active lobby player's color
      for (let i = 0; i < BALL_COLORS.length; i++) {
        const sx = 460 + 100 + (i % 4) * 50;
        const sy = 433 + Math.floor(i / 4) * 38;
        if (dist(mx, my, sx, sy) < 16) {
          players[activeLobbyPlayer].color = BALL_COLORS[i].rgb.slice();
          return;
        }
      }
      // Play button
      const btn = lobbyPlayButton();
      if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
        startGame();
      }
    }

    function startGame() {
      // In multiplayer, ask each player for their name (Enter/Cancel = keep current/default)
      if (numPlayers > 1) {
        for (let i = 0; i < numPlayers; i++) {
          const defaultName = players[i].name || `Player ${i + 1}`;
          const entered = prompt(`Player ${i + 1}: enter your name`, defaultName);
          const trimmed = entered != null ? entered.trim() : '';
          players[i].name = trimmed !== '' ? trimmed.slice(0, 16) : defaultName;
        }
      }

      gameState = 'playing';
      currentHoleIndex = 0;
      currentPlayerIndex = 0;
      resetAllPlayerScores();
      won = false;
      resizeCanvas(hole().canvas.w, hole().canvas.h);
      resetBall();
    }

    function resetAllPlayerScores() {
      for (let i = 0; i < players.length; i++) {
        players[i].holeScores = [];
        players[i].totalStrokes = 0;
        players[i].strokes = 0;
      }
    }

    function drawHole() {
      const h = hole();
      background(95, 145, 70);

      // Fairway segments
      stroke(155, 210, 110);
      strokeCap(ROUND);
      for (const seg of h.fairway) {
        strokeWeight(seg.width);
        line(seg.x1, seg.y1, seg.x2, seg.y2);
      }

      noStroke();
      fill(110, 170, 80);
      rect(h.teeBox.x - h.teeBox.w / 2, h.teeBox.y - h.teeBox.h / 2, h.teeBox.w, h.teeBox.h, 6);

      // Tee markers (perpendicular to first fairway segment)
      const firstSeg = h.fairway[0];
      const segDx = firstSeg.x2 - firstSeg.x1;
      const segDy = firstSeg.y2 - firstSeg.y1;
      const segLen = Math.hypot(segDx, segDy);
      const perpX = -segDy / segLen;
      const perpY = segDx / segLen;
      const markerOffset = 18;
      fill(255);
      circle(h.tee.x + perpX * markerOffset, h.tee.y + perpY * markerOffset, 8);
      circle(h.tee.x - perpX * markerOffset, h.tee.y - perpY * markerOffset, 8);

      fill(60, 130, 220);
      for (const w of h.water) {
        ellipse(w.x, w.y, w.w, w.h);
      }

      drawBridges();

      fill(230, 210, 150);
      for (const s of h.sand) {
        circle(s.x, s.y, s.r * 2);
      }

      fill(80, 160, 70);
      circle(h.green.x, h.green.y, h.green.r * 2);

      drawPepperoni();

      fill(20);
      circle(h.cup.x, h.cup.y, h.cup.r * 2);

      drawWalls();
      drawTrees();
      drawFlag();
    }

    function wallY(w) {
      return w.y + (w.range || 0) * Math.sin(frameCount * (w.speed || 0));
    }

    function drawWalls() {
      const walls = hole().walls;
      if (!walls) return;
      for (const w of walls) {
        const wy = wallY(w);
        // Cast a small ground shadow beneath the wall
        noStroke();
        fill(0, 0, 0, 50);
        ellipse(w.x, wy + w.h / 2 + 4, w.w * 1.2, 6);
        // Brick body
        stroke(80, 35, 25);
        strokeWeight(2);
        fill(190, 90, 70);
        rect(w.x - w.w / 2, wy - w.h / 2, w.w, w.h, 4);
        // Brick lines (faint horizontal courses)
        stroke(110, 55, 40);
        strokeWeight(1);
        const rows = 4;
        for (let i = 1; i < rows; i++) {
          const ly = wy - w.h / 2 + (w.h / rows) * i;
          line(w.x - w.w / 2 + 3, ly, w.x + w.w / 2 - 3, ly);
        }
      }
    }

    function drawBridges() {
      const bridges = hole().bridges;
      if (!bridges) return;
      for (const b of bridges) {
        push();
        translate(b.x, b.y);
        rotate(b.angle || 0);

        // Deck (wooden brown)
        stroke(80, 50, 30);
        strokeWeight(2);
        fill(160, 110, 70);
        rect(-b.w / 2, -b.h / 2, b.w, b.h, 4);

        // Plank seams (perpendicular to bridge length)
        stroke(95, 60, 35);
        strokeWeight(1);
        const numPlanks = 9;
        for (let i = 1; i < numPlanks; i++) {
          const lx = -b.w / 2 + (b.w / numPlanks) * i;
          line(lx, -b.h / 2 + 3, lx, b.h / 2 - 3);
        }

        pop();
      }
    }

    function drawPepperoni() {
      const peps = hole().pepperoni;
      if (!peps) return;
      noStroke();
      for (const p of peps) {
        // Base dark-red disc
        fill(150, 35, 35);
        circle(p.x, p.y, p.r * 2);
        // Brighter ring inside for depth
        fill(195, 70, 55);
        circle(p.x, p.y, p.r * 1.55);
        // Highlight blob
        fill(230, 130, 100, 180);
        circle(p.x - p.r * 0.25, p.y - p.r * 0.25, p.r * 0.9);
      }
    }

    function drawTrees() {
      const trees = hole().trees;
      if (!trees) return;
      noStroke();
      for (const t of trees) {
        // Shadow on the ground
        fill(0, 0, 0, 50);
        ellipse(t.x + t.r * 0.4, t.y + t.r * 0.85, t.r * 1.7, t.r * 0.55);
        // Trunk
        fill(110, 70, 40);
        rect(t.x - t.r * 0.18, t.y + t.r * 0.45, t.r * 0.36, t.r * 0.75, 2);
        // Canopy (darker outer + brighter inner highlight for depth)
        fill(40, 110, 50);
        circle(t.x, t.y, t.r * 2);
        fill(70, 155, 70);
        circle(t.x - t.r * 0.22, t.y - t.r * 0.22, t.r * 1.35);
      }
    }

    function drawFlag() {
      const h = hole();
      const px = h.cup.x;
      const pyTop = h.cup.y - 42;

      stroke(120, 80, 40);
      strokeWeight(2);
      line(px, h.cup.y, px, pyTop);

      noStroke();
      fill(220, 60, 60);
      if (h.wind) {
        const mag = Math.hypot(h.wind.dx, h.wind.dy);
        const ux = h.wind.dx / mag;
        const uy = h.wind.dy / mag;
        const flagLen = 22;
        const wave = Math.sin(frameCount * 0.15) * 3;
        const waveX = -uy * wave;
        const waveY = ux * wave;
        triangle(
          px, pyTop,
          px + ux * flagLen + waveX, pyTop + uy * flagLen + waveY,
          px, pyTop + 9
        );
      } else {
        triangle(px, pyTop, px + 14, pyTop + 5, px, pyTop + 9);
      }
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x <= BALL_R || ball.x >= width - BALL_R ||
          ball.y <= BALL_R || ball.y >= height - BALL_R) {
        // Out of bounds — return to last shot position, no penalty
        ball.x = lastShotPos.x;
        ball.y = lastShotPos.y;
        ball.vx = 0;
        ball.vy = 0;
        return;
      }

      const f = inTree() ? TREE_FRICTION
              : inSand() ? SAND_FRICTION
              : inGreen() ? ((shotClub && shotClub !== 'putter') ? GREEN_PENALTY_FRICTION : FRICTION)
              : inFairway() ? FRICTION
              : ROUGH_FRICTION;
      ball.vx *= f;
      ball.vy *= f;

      wallCollision();

      const speed = Math.hypot(ball.vx, ball.vy);
      if (speed < STOP_SPEED) {
        ball.vx = 0;
        ball.vy = 0;
        shotClub = null;
      } else if (hole().wind && speed >= WIND_THRESHOLD) {
        ball.vx += hole().wind.dx;
        ball.vy += hole().wind.dy;
      }

      if (!won && inWater()) {
        ball.x = lastShotPos.x;
        ball.y = lastShotPos.y;
        ball.vx = 0;
        ball.vy = 0;
        return;
      }

      const cup = hole().cup;
      if (!won && dist(ball.x, ball.y, cup.x, cup.y) < cup.r && speed < SINK_SPEED) {
        won = true;
        ball.x = cup.x;
        ball.y = cup.y;
        ball.vx = 0;
        ball.vy = 0;
      }
    }

    function drawBall() {
      const c = currentPlayer().color;
      stroke(50);
      strokeWeight(1);
      fill(c[0], c[1], c[2]);
      circle(ball.x, ball.y, BALL_R * 2);
    }

    function drawAimArrow() {
      const dx = ball.x - mouseX;
      const dy = ball.y - mouseY;
      const dragLen = Math.min(Math.hypot(dx, dy), MAX_DRAG);
      if (dragLen < 5) return;
      const angle = Math.atan2(dy, dx);
      const ex = ball.x + Math.cos(angle) * dragLen;
      const ey = ball.y + Math.sin(angle) * dragLen;

      stroke(220, 40, 40);
      strokeWeight(3);
      line(ball.x, ball.y, ex, ey);

      const headLen = 10;
      const left = angle + Math.PI - 0.4;
      const right = angle + Math.PI + 0.4;
      line(ex, ey, ex + Math.cos(left) * headLen, ey + Math.sin(left) * headLen);
      line(ex, ey, ex + Math.cos(right) * headLen, ey + Math.sin(right) * headLen);
    }

    function drawHud() {
      noStroke();
      fill(255);
      textSize(18);
      textAlign(LEFT, TOP);
      text(`Hole #${currentHoleIndex + 1}`, 14, 12);
      text(`Par: ${hole().par}`, 14, 34);

      const cp = currentPlayer();
      let scorecardY;
      if (numPlayers > 1) {
        // Whose turn indicator
        stroke(50);
        strokeWeight(1);
        fill(cp.color[0], cp.color[1], cp.color[2]);
        circle(24, 66, 14);
        noStroke();
        fill(255);
        textSize(16);
        text(`${cp.name}'s turn`, 38, 58);
        textSize(18);
        text(`Strokes: ${cp.strokes}`, 14, 82);
        text(`Club: ${CLUBS[currentClub].name}`, 14, 104);
        scorecardY = 132;
      } else {
        text(`Strokes: ${cp.strokes}`, 14, 56);
        text(`Club: ${CLUBS[currentClub].name}`, 14, 78);
        scorecardY = 112;
      }

      drawScorecard(scorecardY);
      drawWindIndicator();
    }

    function drawScorecard(y0Param) {
      const y0 = y0Param != null ? y0Param : 112;
      const x0 = 14;
      const colW = 28;
      const rowH = 20;
      const holes = currentCourse().holes;

      textSize(13);
      noStroke();

      if (numPlayers === 1) {
        drawSinglePlayerScorecard(x0, y0, colW, rowH, holes);
      } else {
        drawMultiPlayerScorecard(x0, y0, colW, rowH, holes);
      }
    }

    function drawSinglePlayerScorecard(x0, y0, colW, rowH, holes) {
      const labelW = 52;
      const player = players[0];

      textAlign(LEFT, TOP);
      fill(200);
      text('Hole', x0, y0);
      text('Score', x0, y0 + rowH);
      text('vs Par', x0, y0 + rowH * 2);

      textAlign(CENTER, TOP);
      for (let i = 0; i < holes.length; i++) {
        const cx = x0 + labelW + i * colW;

        if (i === currentHoleIndex && !won) {
          noFill();
          stroke(255, 220, 80);
          strokeWeight(1.5);
          rect(cx - colW / 2 + 4, y0 - 3, colW - 8, rowH * 3 - 1, 3);
          noStroke();
        }

        fill(200);
        text(i + 1, cx, y0);

        let scoreStr;
        let diffStr = '·';
        let diffColor = [200, 200, 200];

        if (i < player.holeScores.length) {
          if (player.holeScores[i] === null) {
            scoreStr = '–';
            diffStr = '–';
          } else {
            scoreStr = String(player.holeScores[i]);
            const diff = player.holeScores[i] - holes[i].par;
            if (diff < 0) {
              diffStr = String(diff);
              diffColor = [120, 230, 130];
            } else if (diff === 0) {
              diffStr = 'E';
              diffColor = [220, 220, 220];
            } else {
              diffStr = '+' + diff;
              diffColor = [255, 130, 130];
            }
          }
        } else if (i === currentHoleIndex) {
          scoreStr = String(player.strokes);
        } else {
          scoreStr = '·';
        }

        fill(255);
        text(scoreStr, cx, y0 + rowH);
        fill(diffColor[0], diffColor[1], diffColor[2]);
        text(diffStr, cx, y0 + rowH * 2);
      }

      textAlign(LEFT, TOP);
      fill(220);
      text(`Total: ${player.totalStrokes + player.strokes}`, x0, y0 + rowH * 3 + 6);
    }

    function drawMultiPlayerScorecard(x0, y0, colW, rowH, holes) {
      const labelW = 44;

      // Header row: "Hole" + hole numbers
      textAlign(LEFT, TOP);
      fill(200);
      text('Hole', x0, y0);
      textAlign(CENTER, TOP);
      for (let i = 0; i < holes.length; i++) {
        const cx = x0 + labelW + i * colW;
        text(i + 1, cx, y0);
      }

      // Highlight current hole column across all player rows
      if (!won) {
        noFill();
        stroke(255, 220, 80);
        strokeWeight(1.5);
        const cx = x0 + labelW + currentHoleIndex * colW;
        rect(cx - colW / 2 + 4, y0 - 3, colW - 8, rowH * (numPlayers + 1) - 1, 3);
        noStroke();
      }

      // One row per player
      for (let p = 0; p < numPlayers; p++) {
        const py = y0 + rowH * (p + 1);
        const player = players[p];

        // Color dot
        stroke(50);
        strokeWeight(1);
        fill(player.color[0], player.color[1], player.color[2]);
        circle(x0 + 8, py + 8, 10);

        // Label
        noStroke();
        if (p === currentPlayerIndex) fill(255, 220, 80);
        else fill(200);
        textAlign(LEFT, TOP);
        text(`P${p + 1}`, x0 + 16, py);

        // Scores per hole
        textAlign(CENTER, TOP);
        for (let i = 0; i < holes.length; i++) {
          const cx = x0 + labelW + i * colW;
          let scoreStr;
          if (i < player.holeScores.length) {
            scoreStr = player.holeScores[i] === null ? '–' : String(player.holeScores[i]);
          } else if (i === currentHoleIndex && p === currentPlayerIndex) {
            scoreStr = String(player.strokes);
          } else {
            scoreStr = '·';
          }
          fill(255);
          text(scoreStr, cx, py);
        }
      }

      // Totals row
      textAlign(LEFT, TOP);
      fill(220);
      const totalY = y0 + rowH * (numPlayers + 1) + 4;
      let tx = x0;
      for (let p = 0; p < numPlayers; p++) {
        const player = players[p];
        const total = player.totalStrokes + (p === currentPlayerIndex ? player.strokes : 0);
        text(`P${p + 1}:${total}`, tx, totalY);
        tx += 52;
      }
    }

    function drawWindIndicator() {
      const w = hole().wind;
      if (!w) return;
      noStroke();
      fill(255);
      textSize(14);
      textAlign(RIGHT, TOP);
      text('Wind', width - 14, 12);
      const cx = width - 50;
      const cy = 44;
      const angle = Math.atan2(w.dy, w.dx);
      const len = 22;
      const ex = cx + Math.cos(angle) * len;
      const ey = cy + Math.sin(angle) * len;
      stroke(180, 220, 255);
      strokeWeight(3);
      line(cx, cy, ex, ey);
      const lAng = angle + Math.PI - 0.4;
      const rAng = angle + Math.PI + 0.4;
      line(ex, ey, ex + Math.cos(lAng) * 7, ey + Math.sin(lAng) * 7);
      line(ex, ey, ex + Math.cos(rAng) * 7, ey + Math.sin(rAng) * 7);
    }

    function drawWinScreen() {
      fill(0, 0, 0, 170);
      rect(0, 0, width, height);

      const cp = currentPlayer();
      if (cp.strokes === 1) drawFireworks();

      fill(255);
      textAlign(CENTER, CENTER);

      const isLastHole = currentHoleIndex >= currentCourse().holes.length - 1;
      const isLastPlayer = currentPlayerIndex >= numPlayers - 1;
      const label = scoreLabel(cp.strokes, hole().par);

      if (numPlayers === 1) {
        // Single-player flow (unchanged behavior)
        if (isLastHole) {
          const total = cp.totalStrokes + cp.strokes;
          textSize(48);
          text(label, width / 2, height / 2 - 80);
          textSize(28);
          text('Round complete!', width / 2, height / 2 - 30);
          textSize(22);
          text(`Hole #${currentHoleIndex + 1}: ${cp.strokes} stroke${cp.strokes === 1 ? '' : 's'}`, width / 2, height / 2 + 10);
          text(`Total: ${total} stroke${total === 1 ? '' : 's'}`, width / 2, height / 2 + 40);
          textSize(16);
          text('Click anywhere to play again', width / 2, height / 2 + 80);
        } else {
          textSize(48);
          text(label, width / 2, height / 2 - 50);
          textSize(22);
          text(`Hole #${currentHoleIndex + 1} in ${cp.strokes} stroke${cp.strokes === 1 ? '' : 's'}`, width / 2, height / 2 + 10);
          textSize(16);
          text('Click anywhere for the next hole', width / 2, height / 2 + 50);
        }
        return;
      }

      // Multi-player win screen
      if (isLastHole && isLastPlayer) {
        drawLeaderboard();
        return;
      }

      // Per-hole multi-player win screen
      stroke(50);
      strokeWeight(2);
      fill(cp.color[0], cp.color[1], cp.color[2]);
      circle(width / 2, height / 2 - 110, 36);

      noStroke();
      fill(255);
      textSize(38);
      text(`${cp.name}: ${label}`, width / 2, height / 2 - 60);
      textSize(20);
      text(`${cp.strokes} stroke${cp.strokes === 1 ? '' : 's'} · Hole #${currentHoleIndex + 1}`, width / 2, height / 2 - 20);

      if (isLastPlayer) {
        textSize(18);
        fill(220);
        text('Click anywhere for the next hole', width / 2, height / 2 + 30);
      } else {
        // Next player's color dot + invite
        const np = players[currentPlayerIndex + 1];
        const msg = `Click for ${np.name}'s turn`;
        textSize(20);
        const w = textWidth(msg);
        const dotX = width / 2 - w / 2 - 16;
        stroke(50);
        strokeWeight(1.5);
        fill(np.color[0], np.color[1], np.color[2]);
        circle(dotX, height / 2 + 40, 18);
        noStroke();
        fill(220);
        text(msg, width / 2, height / 2 + 40);
      }
    }

    function drawLeaderboard() {
      // Score each player as cumulative strokes vs par across all holes played.
      // The current player's last-hole strokes haven't been pushed into holeScores
      // yet, so handle them separately.
      const courseHoles = currentCourse().holes;
      const playerDiff = (i) => {
        const p = players[i];
        let diff = 0;
        for (let h = 0; h < p.holeScores.length; h++) {
          if (p.holeScores[h] !== null) {
            diff += p.holeScores[h] - courseHoles[h].par;
          }
        }
        if (i === currentPlayerIndex) {
          diff += p.strokes - courseHoles[currentHoleIndex].par;
        }
        return diff;
      };
      const ranked = [];
      for (let i = 0; i < numPlayers; i++) {
        ranked.push({
          idx: i,
          name: players[i].name || `Player ${i + 1}`,
          color: players[i].color,
          diff: playerDiff(i),
        });
      }
      ranked.sort((a, b) => a.diff - b.diff);

      const cx = width / 2;
      const rowH = 56;
      const rowW = 460;
      const totalListH = ranked.length * rowH;
      const listStartY = Math.max(180, height / 2 - totalListH / 2 - 10);

      // Title + subtitle
      textAlign(CENTER, CENTER);
      noStroke();
      fill(255, 220, 80);
      textSize(40);
      text('🏆 Final Results', cx, listStartY - 75);
      fill(220);
      textSize(20);
      text('Round Complete!', cx, listStartY - 38);

      // Medal colors for top 3 + a default gray for the rest
      const rankColors = [
        [255, 215,  0],  // gold
        [200, 200, 210], // silver
        [205, 127, 50],  // bronze
        [120, 120, 120], // gray
      ];

      for (let r = 0; r < ranked.length; r++) {
        const e = ranked[r];
        const py = listStartY + r * rowH;
        const rowCy = py + rowH / 2;
        const isWinner = r === 0;
        const rc = rankColors[Math.min(r, 3)];

        // Row background pill
        noStroke();
        fill(255, 255, 255, isWinner ? 45 : 25);
        rect(cx - rowW / 2, py + 4, rowW, rowH - 8, 10);

        // Rank badge (gold/silver/bronze)
        stroke(40);
        strokeWeight(2);
        fill(rc[0], rc[1], rc[2]);
        circle(cx - rowW / 2 + 28, rowCy, 36);
        noStroke();
        fill(40);
        textAlign(CENTER, CENTER);
        textSize(20);
        text(`${r + 1}`, cx - rowW / 2 + 28, rowCy);

        // Player ball color
        stroke(40);
        strokeWeight(1);
        fill(e.color[0], e.color[1], e.color[2]);
        circle(cx - rowW / 2 + 72, rowCy, 26);

        // Name
        noStroke();
        fill(255);
        textAlign(LEFT, CENTER);
        textSize(isWinner ? 26 : 22);
        text(e.name, cx - rowW / 2 + 95, rowCy);

        // Score (vs par — green under, gray even, red over)
        let diffStr, diffR, diffG, diffB;
        if (e.diff < 0) {
          diffStr = String(e.diff);
          diffR = 120; diffG = 230; diffB = 130;
        } else if (e.diff === 0) {
          diffStr = 'E';
          diffR = 220; diffG = 220; diffB = 220;
        } else {
          diffStr = '+' + e.diff;
          diffR = 255; diffG = 130; diffB = 130;
        }
        fill(diffR, diffG, diffB);
        textAlign(RIGHT, CENTER);
        textSize(isWinner ? 26 : 22);
        text(diffStr, cx + rowW / 2 - 20, rowCy);

        // Trophy for winner
        if (isWinner) {
          textAlign(RIGHT, CENTER);
          textSize(28);
          text('🏆', cx + rowW / 2 - 70, rowCy);
        }
      }

      // Footer
      textAlign(CENTER, CENTER);
      textSize(16);
      fill(220);
      text('Click to return to the lobby', cx, listStartY + totalListH + 28);
    }

    function drawFireworks() {
      const bursts = [
        { x: width * 0.20, y: height * 0.30 },
        { x: width * 0.50, y: height * 0.18 },
        { x: width * 0.80, y: height * 0.30 },
        { x: width * 0.30, y: height * 0.65 },
        { x: width * 0.70, y: height * 0.65 },
      ];
      const colors = [
        [255, 100, 100],
        [255, 220, 80],
        [120, 200, 255],
        [220, 130, 255],
        [120, 255, 160],
      ];
      const cycle = 90;
      const sparks = 14;
      noStroke();
      for (let b = 0; b < bursts.length; b++) {
        const burst = bursts[b];
        const phase = ((frameCount + b * 18) % cycle) / cycle;
        const radius = phase * 140;
        const alpha = (1 - phase) * 255;
        const c = colors[b % colors.length];
        fill(c[0], c[1], c[2], alpha);
        for (let i = 0; i < sparks; i++) {
          const angle = (i / sparks) * TWO_PI;
          const x = burst.x + Math.cos(angle) * radius;
          const y = burst.y + Math.sin(angle) * radius;
          circle(x, y, 6);
        }
      }
    }

    function scoreLabel(strokes, par) {
      if (strokes === 1) return 'Hole in One!';
      const diff = strokes - par;
      if (diff <= -3) return 'Albatross!';
      if (diff === -2) return 'Eagle!';
      if (diff === -1) return 'Birdie! 🎉';
      if (diff === 0) return 'Par 😊';
      if (diff === 1) return 'Bogey 😢';
      if (diff === 2) return 'Double Bogey 😢';
      if (diff === 3) return 'Triple Bogey 😢';
      return `+${diff} 😢`;
    }

    function isStopped() {
      return ball.vx === 0 && ball.vy === 0;
    }

    function inSand() {
      return hole().sand.some(s => dist(ball.x, ball.y, s.x, s.y) < s.r);
    }

    function inTree() {
      const trees = hole().trees;
      if (!trees) return false;
      return trees.some(t => dist(ball.x, ball.y, t.x, t.y) < t.r);
    }

    function wallCollision() {
      const walls = hole().walls;
      if (!walls) return;
      for (const w of walls) {
        const wy = wallY(w);
        const left   = w.x - w.w / 2;
        const right  = w.x + w.w / 2;
        const top    = wy - w.h / 2;
        const bottom = wy + w.h / 2;

        if (ball.x > left && ball.x < right && ball.y > top && ball.y < bottom) {
          // Ball center is INSIDE the wall — pop it out the nearest edge
          const dLeft = ball.x - left;
          const dRight = right - ball.x;
          const dTop = ball.y - top;
          const dBottom = bottom - ball.y;
          const m = Math.min(dLeft, dRight, dTop, dBottom);
          if (m === dLeft) {
            ball.x = left - BALL_R;
            ball.vx = -Math.abs(ball.vx) * 0.85;
          } else if (m === dRight) {
            ball.x = right + BALL_R;
            ball.vx = Math.abs(ball.vx) * 0.85;
          } else if (m === dTop) {
            ball.y = top - BALL_R;
            ball.vy = -Math.abs(ball.vy) * 0.85;
          } else {
            ball.y = bottom + BALL_R;
            ball.vy = Math.abs(ball.vy) * 0.85;
          }
          continue;
        }

        // Standard rect-circle bounce
        const cx = Math.max(left, Math.min(ball.x, right));
        const cy = Math.max(top, Math.min(ball.y, bottom));
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        const dSq = dx * dx + dy * dy;
        if (dSq < BALL_R * BALL_R && dSq > 0) {
          const d = Math.sqrt(dSq);
          const nx = dx / d;
          const ny = dy / d;
          ball.x = cx + nx * BALL_R;
          ball.y = cy + ny * BALL_R;
          const dot = ball.vx * nx + ball.vy * ny;
          if (dot < 0) {
            ball.vx -= 2 * dot * nx * 0.9; // small energy loss on bounce
            ball.vy -= 2 * dot * ny * 0.9;
          }
        }
      }
    }

    function inWater() {
      if (onBridge()) return false;
      return hole().water.some(w => {
        const dx = (ball.x - w.x) / (w.w / 2);
        const dy = (ball.y - w.y) / (w.h / 2);
        return dx * dx + dy * dy < 1;
      });
    }

    function onBridge() {
      const bridges = hole().bridges;
      if (!bridges) return false;
      for (const b of bridges) {
        const angle = b.angle || 0;
        const cos = Math.cos(-angle);
        const sin = Math.sin(-angle);
        const dx = ball.x - b.x;
        const dy = ball.y - b.y;
        const localX = dx * cos - dy * sin;
        const localY = dx * sin + dy * cos;
        if (Math.abs(localX) < b.w / 2 && Math.abs(localY) < b.h / 2) {
          return true;
        }
      }
      return false;
    }

    function inGreen() {
      const g = hole().green;
      return dist(ball.x, ball.y, g.x, g.y) < g.r;
    }

    function inFairway() {
      return hole().fairway.some(seg => {
        const dx = seg.x2 - seg.x1;
        const dy = seg.y2 - seg.y1;
        const lenSq = dx * dx + dy * dy;
        let t = ((ball.x - seg.x1) * dx + (ball.y - seg.y1) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));
        const projX = seg.x1 + t * dx;
        const projY = seg.y1 + t * dy;
        return dist(ball.x, ball.y, projX, projY) < seg.width / 2;
      });
    }

    function mousePressed() {
      if (gameState === 'lobby') {
        lobbyClick(mouseX, mouseY);
        return;
      }
      if (won) {
        advanceOrRestart();
        return;
      }
      if (isStopped() && dist(mouseX, mouseY, ball.x, ball.y) < 40) {
        aiming = true;
      }
    }

    function mouseReleased() {
      if (!aiming || won) return;
      aiming = false;

      const dx = ball.x - mouseX;
      const dy = ball.y - mouseY;
      const dragLen = Math.min(Math.hypot(dx, dy), MAX_DRAG);
      if (dragLen < 5) return;

      const angle = Math.atan2(dy, dx);
      const power = dragLen * POWER_SCALE * CLUBS[currentClub].power;
      lastShotPos = { x: ball.x, y: ball.y };
      shotClub = currentClub;
      ball.vx = Math.cos(angle) * power;
      ball.vy = Math.sin(angle) * power;
      currentPlayer().strokes++;
    }

    function advanceOrRestart() {
      // Record current player's score for this hole and reset their hole strokes
      const cp = currentPlayer();
      cp.holeScores.push(cp.strokes);
      cp.totalStrokes += cp.strokes;
      cp.strokes = 0;
      won = false;

      // More players still to play this hole?
      if (currentPlayerIndex < numPlayers - 1) {
        currentPlayerIndex++;
        resetBall();
        return;
      }

      // All players done with this hole — advance hole, or back to lobby if last
      const isLastHole = currentHoleIndex >= currentCourse().holes.length - 1;
      if (isLastHole) {
        gameState = 'lobby';
        resetAllPlayerScores();
        currentHoleIndex = 0;
        currentPlayerIndex = 0;
        resizeCanvas(LOBBY_W, LOBBY_H);
        resetBall();
        return;
      }
      currentHoleIndex++;
      currentPlayerIndex = 0;
      resizeCanvas(hole().canvas.w, hole().canvas.h);
      resetBall();
    }

    document.querySelectorAll('.clubs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.clubs button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        currentClub = btn.dataset.club;
      });
    });

    document.getElementById('skip-hole').addEventListener('click', () => {
      if (gameState === 'lobby') return;

      // Skip current player on current hole
      const cp = currentPlayer();
      cp.holeScores.push(null);
      cp.strokes = 0;
      won = false;

      // More players still to play this hole?
      if (currentPlayerIndex < numPlayers - 1) {
        currentPlayerIndex++;
        resetBall();
        return;
      }

      // All players done with this hole — advance or restart
      const isLastHole = currentHoleIndex >= currentCourse().holes.length - 1;
      if (isLastHole) {
        resetAllPlayerScores();
        currentHoleIndex = 0;
      } else {
        currentHoleIndex++;
      }
      currentPlayerIndex = 0;
      resizeCanvas(hole().canvas.w, hole().canvas.h);
      resetBall();
    });
  </script>
